name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Refresh regional data even if it is less than 24 hours old
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check regional data code
        run: |
          python3 -m unittest discover -s scripts -p 'test_regions.py'
          node scripts/test-regions.mjs
          node scripts/test-multilingual.mjs
          node scripts/test-editorial-translations.mjs
          node scripts/test-study-translations.mjs
          node scripts/test-information.mjs
          node scripts/test-study-photo-layout.mjs
          node scripts/test-study-viewport.mjs
          node scripts/test-study-state.mjs
          node scripts/test-progress-copy.mjs
          node scripts/test-backup.mjs
          node scripts/test-accessibility.mjs
          node scripts/test-learning-settings.mjs
          node scripts/test-hybrid-learning.mjs
          python3 -m unittest discover -s scripts -p 'test_current.py'
          node scripts/validate-photos.mjs
          node --check dist/app.js
          node --check dist/accessibility.js
          node --check dist/backup.js
          node --check dist/learning-storage.js
          node --check dist/study-viewport.js
          node --check dist/i18n.js
      - name: Refresh eBird regional species lists
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            python3 scripts/update-regions.py
          else
            python3 scripts/update-regions.py --if-due
          fi
      - name: Refresh current notable records
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: python3 scripts/update-current.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
