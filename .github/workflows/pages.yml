name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check regional data code
        run: |
          python3 -m unittest discover -s scripts -p 'test_regions.py'
          node scripts/test-regions.mjs
          node scripts/test-multilingual.mjs
          node scripts/test-study-state.mjs
          node --check dist/app.js
          node --check dist/i18n.js
      - name: Refresh eBird regional species lists
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: python3 scripts/update-regions.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
