name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Refresh regional data even if it is less than 24 hours old
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          check-latest: true
      - name: Report runtime versions
        run: |
          node --version
          npm --version
          python3 --version
      - name: Check application and data
        run: |
          npm test
          for test in scripts/test-*.mjs; do node "$test" || exit 1; done
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/validate-data.py
          python3 scripts/build-ebd-seasonal.py --check
          python3 scripts/check-private-ebd.py
          node scripts/validate-photos.mjs
          for file in dist/*.js; do node --check "$file" || exit 1; done
          git diff --exit-code -- dist data
      - name: Refresh eBird regional species lists
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            python3 scripts/update-regions.py
          else
            python3 scripts/update-regions.py --if-due
          fi
      - name: Refresh current notable records
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: python3 scripts/update-current.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
